name: Auto Encrypt Blog

on:
  push:
    branches: [ main ]

jobs:
  encrypt-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Staticrypt
        run: npm install -g staticrypt

      - name: Encrypt all HTML files
        run: |
          staticrypt . -p ${{ secrets.BLOG_PASSWORD }} -o ./dist --exclude "node_modules|.git|.github|dist"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
